name: CI

on:
  push:
    branches: [main, notes]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Only needed so `import src.pipeline` etc. can run at all — the test
      # suite itself mocks the OCR pipeline (see tests/test_api_documents.py),
      # it never shells out to the real Tesseract binary.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            tesseract-ocr libgl1 libglib2.0-0 fonts-liberation fonts-dejavu-core

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'requirements-api.txt', 'requirements-web.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q --cov=src --cov=api --cov-report=term-missing
        env:
          # deliberately unset — every test that touches the LLM layer mocks
          # OpenRouter, so CI never makes a real (paid) API call.
          OPENROUTER_API_KEY: ""

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f Dockerfile.api -t docai-api:ci .

      - name: Build web image
        run: docker build -f Dockerfile.web -t docai-web:ci .
